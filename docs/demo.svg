<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">vulnscan terminal demonstration</title>
  <desc id="description">A successful pytest run followed by a permission-gated vulnscan command</desc>
  <rect width="1280" height="720" rx="20" fill="#090d12" />
  <rect x="24" y="24" width="1232" height="672" rx="10" fill="#0d1117" stroke="#48515b" stroke-width="2" />
  <circle cx="60" cy="58" r="10" fill="#f06b6b" />
  <circle cx="90" cy="58" r="10" fill="#f6c453" />
  <circle cx="120" cy="58" r="10" fill="#4bc987" />
  <g font-family="Consolas, 'Courier New', monospace" font-size="25">
    <text x="58" y="120" fill="#d9e2ec">(.venv) PS&gt; python -m pytest -q</text>
    <text x="58" y="164" fill="#58d68d">........                                                         [100%]</text>
    <text x="58" y="208" fill="#58d68d">8 passed in 0.27s</text>
    <text x="58" y="278" fill="#d9e2ec">(.venv) PS&gt; python vulnscan.py scanme.nmap.org --scan quick --format both</text>
    <text x="58" y="312" fill="#d9e2ec">                  --i-have-permission</text>
  </g>
  <rect x="58" y="352" width="1164" height="62" rx="7" fill="#101820" stroke="#e0e0e0" stroke-width="2" />
  <text x="76" y="392" fill="#5de8ee" font-family="Consolas, 'Courier New', monospace" font-size="27">vulnscan v1.0.0 - by Shpetim | Dardanex</text>
  <rect x="58" y="442" width="1164" height="104" rx="7" fill="#101010" stroke="#e0e0e0" stroke-width="2" />
  <text x="76" y="480" fill="#f9e467" font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="700">AUTHORIZED USE ONLY</text>
  <text x="76" y="516" fill="#d9e2ec" font-family="Consolas, 'Courier New', monospace" font-size="20">Only scan systems you own or have explicit permission to test.</text>
  <text x="58" y="604" fill="#d9e2ec" font-family="Consolas, 'Courier New', monospace" font-size="23">⠋ Scanning ports and detecting services...</text>
  <text x="58" y="650" fill="#7f8c9a" font-family="Consolas, 'Courier New', monospace" font-size="18">Authorized demo target: scanme.nmap.org</text>
</svg>
